name: Lint

on:
  pull_request:

jobs:
  ruff-format:
    runs-on: ubuntu-latest
    name: ruff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - uses: astral-sh/ruff-action@v3
        with:
          version: "~=0.13.3"
          args: format --check --diff --output-format=github
