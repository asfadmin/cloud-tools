[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "destroy-cumulus"
version = "0.1.11"
description = ""
authors = ["Rohan Weeden <reweeden@alaska.edu>"]
readme = "README.md"
packages = [{include = "destroy_cumulus.py"}]

[tool.poetry.scripts]
destroy-cumulus = "destroy_cumulus:main"
decumulus = "destroy_cumulus:main"

[tool.poetry.dependencies]
python = ">=3.8,<4"
boto3 = "^1.24.78"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
moto = {extras = ["all"], version = "^4.0.5"}
# This version of jsonschema broke an import in older versions of
# openapi-schema-validator because openapi-schema-validator uses a
# "private" underscore import.
# https://github.com/python-openapi/openapi-schema-validator/issues/131
jsonschema = ">=4.20.0"
openapi-schema-validator = ">=0.6.1"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
